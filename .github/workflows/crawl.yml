name: Crawl

on:
  schedule:
    # Weekly, Monday 09:00 UTC. Directories go stale fast, but this is a
    # deliberately gentle cadence to start with - tighten later if needed.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

# Runners are ephemeral - nothing persists between runs except what's
# committed back to the repo. This is what makes the "next check date" /
# staleness logic in the DB carry forward between scheduled runs for free.
permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser for JS-rendered sources
        run: playwright install --with-deps chromium

      # Runs every importer (each isolated, so one blocked/broken source
      # never stops the rest), geocodes new venues, then retires events that
      # stopped appearing at their source. Writes a per-source table to the
      # job summary and fails the run only if NOTHING refreshed.
      - name: Run all importers
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: python scripts/run_all.py

      - name: Export CSV
        if: always()
        run: python scripts/export_csv.py

      - name: Commit updated database and exports
        if: always()
        run: |
          git config user.name "trivia-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trivia.db exports/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated crawl run $(date -u +%Y-%m-%d)"
          git push

      # GitHub auto-disables scheduled workflows after 60 days with no
      # repo activity. Weeks where the crawl finds nothing new push nothing,
      # so this re-enables the workflow on every run to reset that timer.
      - name: Keep scheduled workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/crawl.yml/enable"
